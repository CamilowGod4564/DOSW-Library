# CONFIGURACION DE LA APLICACION
spring.application.name=${APP_NAME}
spring.security.user.name=${SECURITY_USERNAME}
spring.security.user.password=${SECURITY_PASSWORD}


# CONFIGURACION DE POSTGRESQL
spring.jpa.database=${JPA_DATABASE}
spring.sql.init.platform=${SQL_PLATFORM}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# CONFIGURACION DE JPA/HIBERNATE
spring.jpa.show-sql=${SHOW_SQL}
spring.jpa.generate-ddl=${GENERATE_DDL}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO}


# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}